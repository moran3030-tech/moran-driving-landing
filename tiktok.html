  <style>
    :root {
      --navy: #08265C;
      --navy-deep: #041433;
      --blue: #0756B8;
      --yellow: #FFD400;
      --yellow-hover: #E6BE00;
      --wa: #20B65A;
      --white: #FFFFFF;
      --muted: #D5DEEC;
      --radius: 20px;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: clip;
      scroll-behavior: smooth;
    }
    body {
      font-family: 'Heebo', Arial, sans-serif;
      color: var(--white);
      background: var(--navy-deep);
      min-height: 100dvh;
      line-height: 1.4;
      padding-bottom: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }
    img, svg { max-width: 100%; display: block; }
    .bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: var(--navy-deep) url('assets/bg_ambient.webp') center/cover no-repeat;
    }
    .bg::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(4,20,51,.55) 0%, rgba(4,20,51,.92) 70%);
    }
    .page {
      position: relative; z-index: 1;
      width: 100%; max-width: 440px; margin: 0 auto;
      padding: 16px 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    a { color: inherit; }
    :focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; border-radius: 8px; }

    /* ---------- כפתורים ---------- */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; min-height: 48px; border: 0; border-radius: 14px;
      font: 900 1.02rem 'Heebo', Arial, sans-serif; text-decoration: none; cursor: pointer;
      padding: 8px 12px; text-align: center;
      transition: transform .15s ease;
    }
    .btn:active { transform: scale(.98); }
    .btn-wa {
      color: #fff; position: relative; overflow: hidden;
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      box-shadow: 0 8px 20px rgba(37,211,102,.38);
      border: 1.5px solid rgba(255,255,255,0.28);
    }
    .btn-yellow {
      background: linear-gradient(135deg, #FFD400 0%, #F5B700 100%);
      color: var(--navy);
      box-shadow: 0 6px 18px rgba(255,212,0,.3);
    }

    /* ---------- כרטיס וטופס השארת פרטים ---------- */
    .card {
      width: 100%;
      background: rgba(8,38,92,.88);
      border: 1.5px solid rgba(255,212,0,.32);
      border-radius: 18px;
      padding: 12px 14px;
      overflow: hidden;
    }
    .form-card { background: rgba(4,20,51,.92); border-color: rgba(255,212,0,.45); position: relative; }
    .form-card h1 { font-size: 1.05rem; font-weight: 900; color: var(--yellow); text-align: center; margin-bottom: 2px; }
    .form-sub { text-align: center; font-size: 0.82rem; color: var(--muted); margin-bottom: 10px; }
    label.field { display: block; margin-bottom: 8px; font-size: .86rem; font-weight: 700; }
    .input {
      display: block; width: 100%; margin-top: 3px; padding: 11px 12px;
      font: 500 16px 'Heebo', Arial, sans-serif;
      color: #fff; background: rgba(255,255,255,.1);
      border: 1.5px solid rgba(255,255,255,.32); border-radius: 10px; text-align: right;
    }
    .input::placeholder { color: #B8C4D9; }
    .input:focus { border-color: var(--yellow); background: rgba(255,255,255,.16); outline: none; }
    .input.invalid { border-color: #ff6b6b; }
    input[type=tel] { direction: ltr; text-align: right; }
    .consent { display: flex; gap: 8px; align-items: flex-start; font-size: .78rem; color: var(--muted); margin: 4px 0 10px; font-weight: 400; cursor: pointer; }
    .consent input { width: 18px; height: 18px; margin-top: 2px; flex-shrink: 0; accent-color: var(--yellow); }
    .consent a { color: var(--yellow); }
    .error { min-height: 1.2em; color: #ff9b9b; font-size: .84rem; font-weight: 700; margin-bottom: 4px; text-align: center; }
    /* מלכודת בוטים ללא היסט פיקסלים שגורם לגלילה אופקית ב-RTL */
    .hp { display: none !important; }
    .thanks { display: none; text-align: center; padding: 6px 4px; }
    .thanks .tick { font-size: 2rem; color: #3ddc84; }
    .thanks h2 { font-size: 1.1rem; font-weight: 900; margin: 4px 0; color: var(--yellow); }
    .thanks p { color: var(--muted); margin-bottom: 10px; font-size: 0.88rem; }

    /* ---------- פוטר ---------- */
    footer { text-align: center; font-size: .8rem; color: var(--muted); padding: 2px 0 12px; }
    footer a { color: var(--yellow); font-weight: 700; }
    footer .area { margin-bottom: 2px; font-weight: 700; color: var(--white); }
    .ltr { direction: ltr; unicode-bidi: embed; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="page">
    <!-- טופס לידים מהיר -->
    <section class="card form-card" id="lead" aria-label="השארת פרטים">
      <h1>מעדיפים שנחזור אליכם?</h1>
      <p class="form-sub">השאירו שם וטלפון ונחזור אליכם בהקדם</p>
      <form id="leadForm" novalidate>
        <label class="field">שם מלא
          <input class="input" id="custName" name="name" type="text" autocomplete="name" placeholder="איך קוראים לך?" maxlength="60" required>
        </label>
        <label class="field">טלפון נייד
          <input class="input" id="custPhone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="05X-XXXXXXX" maxlength="15" required>
        </label>
        <div class="hp" aria-hidden="true"><label>אל תמלאו שדה זה<input type="text" id="hpField" name="website" tabindex="-1" autocomplete="off"></label></div>
        <label class="consent">
          <input type="checkbox" id="consent" checked required>
          <span>אני מאשר/ת שיחזרו אליי בטלפון או בוואטסאפ בנוגע לשיעורי נהיגה. <a href="privacy.html" target="_blank" rel="noopener">מדיניות פרטיות</a></span>
        </label>
        <p class="error" id="formError" role="alert" aria-live="polite"></p>
        <button type="submit" class="btn btn-yellow" id="submitBtn">שלחו לי פרטים על החבילה והמבצע 👈</button>
      </form>
      <div class="thanks" id="thanks" aria-live="polite">
        <div class="tick" aria-hidden="true">✓</div>
        <h2 id="thanksTitle"></h2>
        <p id="thanksText"></p>
        <a id="thanksWa" class="btn btn-wa" target="_blank" rel="noopener" href="https://wa.me/972546238888" data-wa="lead">שלחו את הפרטים בוואטסאפ עכשיו</a>
      </div>
    </section>

    <footer>
      <p class="area">לימודי נהיגה בבאר שבע, נבטים והסביבה</p>
      <p><a href="tel:0546238888" data-track="call" class="ltr">054-623-8888</a> · <a href="privacy.html">מדיניות פרטיות</a></p>
    </footer>
  </main>

  <script src="config.js"></script>
  <script>
  (function () {
    var C = window.LANDING_CONFIG || {};
    var $ = function (id) { return document.getElementById(id); };

    var tel = C.phoneTel || '0546238888';
    document.querySelectorAll('[data-track="call"]').forEach(function (a) {
      a.href = 'tel:' + tel;
    });

    // שיוך קבוע בקוד לקמפיין טיקטוק עם תמיכה בפרמטרי UTM ומזהה קליק ttclid
    var params = new URLSearchParams(location.search);
    var attrib = {
      leadSource: '🎵 טיקטוק ממומן',
      source: '🎵 טיקטוק ממומן',
      utm_source: 'tiktok',
      utm_medium: 'paid_social',
      utm_campaign: 'tiktok_campaign',
      utm_content: 'tiktok_form_lp'
    };
    var hasCustomContent = false;
    ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','ttclid'].forEach(function (k) {
      var storageKey = 'tiktok_lp_' + k;
      var v = params.get(k);
      try {
        if (v) sessionStorage.setItem(storageKey, v); else v = sessionStorage.getItem(storageKey);
      } catch (e) {}
      if (v) {
        if (k === 'utm_content') hasCustomContent = true;
        attrib[k] = v;
      }
    });
    attrib.leadSource = '🎵 טיקטוק ממומן';
    attrib.source = '🎵 טיקטוק ממומן';
    attrib.utm_source = attrib.utm_source || 'tiktok';
    if (attrib.ttclid && !hasCustomContent) {
      attrib.utm_content = 'tiktok_form_lp (ttclid: ' + attrib.ttclid + ')';
    }

    if (C.metaPixelId) {
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', C.metaPixelId); fbq('track', 'PageView');
    }
    if (C.tiktokPixelId) {
      !function(w,d,t){w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=["page","track","identify","instances","debug","on","off","once","ready","alias","group","enableCookie","disableCookie"],ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};for(var i=0;i<ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);ttq.instance=function(t){for(var e=ttq._i[t]||[],n=0;n<ttq.methods.length;n++)ttq.setAndDefer(e,ttq.methods[n]);return e},ttq.load=function(e,n){var i="https://analytics.tiktok.com/i18n/pixel/events.js";ttq._i=ttq._i||{},ttq._i[e]=[],ttq._i[e]._u=i,ttq._t=ttq._t||{},ttq._t[e]=+new Date,ttq._o=ttq._o||{},ttq._o[e]=n||{};var o=document.createElement("script");o.type="text/javascript",o.async=!0,o.src=i+"?sdkid="+e+"&lib="+t;var a=document.getElementsByTagName("script")[0];a.parentNode.insertBefore(o,a)};ttq.load(C.tiktokPixelId);ttq.page()}(window,document,'ttq');
    }
    function track(kind) {
      try {
        if (window.fbq) fbq('track', kind === 'lead' ? 'Lead' : 'Contact');
        if (window.ttq) ttq.track(kind === 'lead' ? 'SubmitForm' : 'Contact');
      } catch (e) {}
    }

    var num = C.whatsappNumber || '972546238888';
    function waUrl(text) { return 'https://wa.me/' + num + '?text=' + encodeURIComponent(text); }
    document.querySelectorAll('[data-wa],[data-track="call"]').forEach(function (a) {
      a.addEventListener('click', function () { track('contact'); });
    });

    var form = $('leadForm'), err = $('formError');
    function normalizePhone(raw) {
      var d = String(raw || '').replace(/\D/g, '');
      if (d.indexOf('972') === 0) d = '0' + d.slice(3);
      return /^05\d{8}$/.test(d) ? d : '';
    }
    function showError(msg, el) { err.textContent = msg; if (el) { el.classList.add('invalid'); el.focus(); } }
    form.addEventListener('input', function (e) { e.target.classList && e.target.classList.remove('invalid'); err.textContent = ''; });

    function showThanks(name, phone, delivered) {
      form.style.display = 'none';
      $('thanks').style.display = 'block';
      $('thanksTitle').textContent = delivered ? 'הפרטים התקבלו בהצלחה!' : 'הפרטים מוכנים לשליחה!';
      $('thanksText').textContent = delivered
        ? 'תודה ' + name + ', נחזור אליך בהקדם. רוצה תשובה מיידית? לחץ כאן לשליחה בוואטסאפ:'
        : 'כדי שהפרטים יגיעו מיד לנייד של המורה, לחצו על הכפתור ושלחו את ההודעה המוכנה בוואטסאפ:';
      $('thanksWa').href = waUrl('היי מורן, הגעתי מטיקטוק והשארתי פרטים בדף הנחיתה: ' + name + ' (' + phone + '). אשמח לפרטים על חבילת נהיגה מושלמת ומבצע חבר מביא חבר 🎁');
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      err.textContent = '';
      var nameEl = $('custName'), phoneEl = $('custPhone');
      var name = nameEl.value.trim(), phone = normalizePhone(phoneEl.value);
      if (name.length < 2) return showError('נא להזין שם מלא', nameEl);
      if (!phone) return showError('נא להזין מספר נייד תקין (למשל 054-1234567)', phoneEl);
      if (!$('consent').checked) return showError('נא לאשר יצירת קשר', $('consent'));
      if ($('hpField').value) return;

      var btn = $('submitBtn'); btn.disabled = true; btn.textContent = 'שולח...';
      var payload = Object.assign({ name: name, phone: phone, page: location.pathname, ts: new Date().toISOString() }, attrib);

      var send = C.leadEndpoint
        ? fetch(C.leadEndpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          })
            .then(function (res) { return res.ok; })
            .catch(function () { return false; })
        : Promise.resolve(false);

      send.then(function (delivered) {
        track('lead');
        showThanks(name, phone, delivered);
      });
    });
  })();
  </script>
</body>
